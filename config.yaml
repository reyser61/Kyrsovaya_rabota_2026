# ============================================================================
#  MailGuard — конфигурация системы анализа почтовых логов
#  Все пороги, словари и параметры детекторов вынесены сюда, чтобы их можно
#  было менять без правки кода (удобно для защиты курсовой работы).
# ============================================================================

# Домены организации. Письма ОТ этих доменов считаются исходящими (для DLP),
# письма, выдающие себя за эти домены с внешних адресов — кандидаты на спуфинг.
internal_domains:
  - corp-mail.ru
  - example-corp.com

# Доверенные домены контрагентов (allow-list). Для писем от/к этим доменам
# слабые сигналы НЕ поднимают тревогу (резко снижает ложные срабатывания).
# Явные сильные признаки (exe-вложение, валидные ПДн и т.п.) срабатывают всегда.
trusted_domains:
  - partner.com
  - gov-client.ru

# Бесплатные / личные почтовые сервисы. Отправка корпоративных данных на них —
# типичный признак утечки.
free_mail_domains:
  - gmail.com
  - mail.ru
  - yandex.ru
  - rambler.ru
  - outlook.com
  - proton.me
  - bk.ru
  - inbox.ru

# ----------------------------------------------------------------------------
#  Детекторы фишинга
# ----------------------------------------------------------------------------
phishing:
  # Слова-маркеры срочности/манипуляции в теме письма (нижний регистр).
  suspicious_subject_keywords:
    - срочно
    - немедленно
    - подтвердите
    - подтверждение учетной записи
    - заблокирован
    - блокировка
    - истекает срок
    - обновите пароль
    - смените пароль
    - verify your account
    - password expired
    - update your password
    - account suspended
    - urgent
    - invoice
    - оплата счета
    - выигрыш
  # Максимальное расстояние Левенштейна, при котором домен-отправитель
  # считается «похожим» на внутренний (атака lookalike / typosquatting).
  lookalike_max_distance: 2
  # Сколько разных получателей за одно письмо считать массовой рассылкой.
  mass_mail_recipients: 15
  # Баллы риска по правилам (используются для итоговой оценки инцидента).
  weights:
    auth_fail: 30          # провал SPF/DKIM/DMARC
    dmarc_fail: 35
    spoofed_internal: 40   # внешний адрес выдаёт себя за внутренний домен
    lookalike_domain: 35
    suspicious_subject: 20
    mass_recipients: 15
    helo_mismatch: 15
    punycode: 25           # IDN/punycode в домене отправителя
    replyto_mismatch: 20   # Reply-To не совпадает с From

# ----------------------------------------------------------------------------
#  Контентные детекторы (работают по ТЕМЕ + ТЕЛУ письма одновременно)
# ----------------------------------------------------------------------------
content:
  weights:
    manipulation: 20         # манипулятивные паттерны (соц. инженерия)
    credential_request: 25   # выманивание учётных данных
    confidential_keyword: 35 # конфиденциальные слова (DLP)
    pii: 35                  # провалидированные ПДн (DLP)
    secret: 40              # секреты/ключи/токены (DLP)
  # Сколько категорий манипулятивных приёмов считать значимым сигналом.
  manipulation_min_categories: 2

# ----------------------------------------------------------------------------
#  Детекторы утечек данных (DLP)
# ----------------------------------------------------------------------------
dlp:
  # Размер исходящего письма (в байтах), выше которого письмо считается крупным.
  large_message_bytes: 5000000   # 5 МБ
  # Ключевые слова, указывающие на конфиденциальное содержимое (в теме письма).
  confidential_keywords:
    - конфиденциально
    - коммерческая тайна
    - персональные данные
    - паспорт
    - снилс
    - реквизиты
    - пароль
    - база клиентов
    - зарплат
    - confidential
    - secret
    - credentials
    - password
  # Порог количества писем одному внешнему получателю за период анализа,
  # после которого это считается потенциальной эксфильтрацией.
  exfil_recipient_threshold: 10
  # Рабочие часы (вне их отправка крупных писем наружу — подозрительна).
  business_hours_start: 8
  business_hours_end: 20
  weights:
    confidential_keyword: 35
    large_external: 25
    free_mail_recipient: 25
    off_hours: 15
    exfiltration_volume: 40
    pii_pattern: 35        # найден шаблон ПДн (карта, паспорт и т.п.)

# ----------------------------------------------------------------------------
#  Детекторы компрометации аккаунта (по логам IMAP / Dovecot)
# ----------------------------------------------------------------------------
account:
  # Сколько неудачных входов с одного IP считать брутфорсом.
  bruteforce_failures: 5
  # Окно (в минутах) для подсчёта неудачных входов.
  bruteforce_window_min: 10
  # Признавать вход без TLS подозрительным.
  flag_plaintext_login: true
  weights:
    bruteforce: 30
    impossible_travel: 35   # вход одного юзера с разных удалённых сетей подряд
    plaintext_login: 15
    login_after_bruteforce: 45

# ----------------------------------------------------------------------------
#  Анализ ТЕЛА письма (требует исходных .eml-файлов)
# ----------------------------------------------------------------------------
body:
  # Сервисы сокращения ссылок — частый приём маскировки фишинговых URL.
  url_shorteners:
    - bit.ly
    - goo.gl
    - tinyurl.com
    - t.co
    - clck.ru
    - is.gd
    - cutt.ly
    - ow.ly
  # Подозрительные доменные зоны, часто используемые в фишинге.
  suspicious_tlds:
    - .top
    - .xyz
    - .zip
    - .review
    - .click
    - .country
    - .gq
    - .tk
  # Слова, характерные для выманивания учётных данных / срочных действий в теле.
  credential_keywords:
    - введите пароль
    - подтвердите пароль
    - подтвердите учетную запись
    - войдите в систему
    - обновите данные
    - подтвердите личность
    - реквизиты карты
    - номер карты
    - cvv
    - verify your account
    - confirm your password
    - log in to
    - update your billing
  weights:
    url_ip_literal: 30        # ссылка ведёт на IP-адрес, а не на домен
    url_shortener: 20
    url_text_mismatch: 35     # видимый текст ссылки не совпадает с реальным href
    url_lookalike: 35         # домен в ссылке — двойник внутреннего
    suspicious_tld: 15
    url_punycode: 25          # punycode (xn--) в домене ссылки

# ----------------------------------------------------------------------------
#  Анализ ВЛОЖЕНИЙ (требует исходных .eml-файлов)
# ----------------------------------------------------------------------------
attachments:
  # Потенциально опасные исполняемые расширения.
  dangerous_extensions:
    - .exe
    - .scr
    - .com
    - .pif
    - .bat
    - .cmd
    - .js
    - .jse
    - .vbs
    - .vbe
    - .wsf
    - .hta
    - .jar
    - .ps1
    - .msi
    - .lnk
  # Документы с поддержкой макросов (носители макровирусов).
  macro_extensions:
    - .docm
    - .xlsm
    - .pptm
    - .dotm
    - .xlm
  # Архивы (могут скрывать исполняемые файлы или быть запароленными).
  archive_extensions:
    - .zip
    - .rar
    - .7z
    - .ace
    - .iso
    - .img
  # Высокорисковые форматы данных: дампы БД, архивы почты (сильный признак DLP).
  highrisk_extensions:
    - .sql
    - .db
    - .bak
    - .dump
    - .pst
    - .ost
    - .mdb
  # Обычные офисные форматы — легитимны сами по себе (СЛАБЫЙ признак, алертят
  # только в сочетании с ПДн/конфиденц. словами/личной почтой и т.п.).
  office_extensions:
    - .pdf
    - .docx
    - .xlsx
    - .xls
    - .doc
    - .csv
    - .pptx
  # HTML/скриптовые вложения (могут содержать фишинговую форму).
  html_extensions:
    - .html
    - .htm
    - .shtml
    - .svg
  # Суммарный размер вложений (байт), выше которого письмо считается крупным.
  max_attachment_bytes: 5000000
  # Максимальный размер архива (байт), который распаковывать для инспекции.
  max_inspect_archive_bytes: 20000000
  weights:
    dangerous_ext: 45
    double_extension: 40      # двойное расширение, напр. invoice.pdf.exe
    macro_document: 25        # .docm/.xlsm по расширению (макрос лишь возможен)
    real_macro: 40            # внутри документа реально найден vbaProject.bin
    archive: 8                # обычный архив — легитимно (слабый признак)
    archive_inner_dangerous: 40  # опасный файл внутри архива
    encrypted_archive: 25     # запароленный архив (обход антивируса)
    html_attachment: 30       # HTML/скрипт-вложение
    highrisk_external: 35     # дамп БД / архив почты уходит наружу (DLP)
    office_external: 12       # обычный документ наружу (слабый, нужен контекст)
    large_attachment: 20

# ----------------------------------------------------------------------------
#  Сбор индикаторов компрометации (IoC)
# ----------------------------------------------------------------------------
ioc:
  # IoC извлекаются только из инцидентов с серьёзностью НЕ НИЖЕ указанной
  # (по решению — заносим только подтверждённые/критичные).
  min_severity: high
  # Какие типы индикаторов извлекать.
  types:
    - ip
    - sender_email
    - sender_domain
    - url_domain
    - file_sha256
    - subject
  # Файл блок-листа известных вредоносных IoC (импортируется/пополняется).
  blocklist_file: data/ioc_blocklist.csv
  # Веса правил совпадения с блок-листом (совпадение — сильный сигнал).
  weights:
    match_ip: 45
    match_email: 45
    match_domain: 45
    match_file_hash: 50
    match_subject: 25

# ----------------------------------------------------------------------------
#  Сопоставление баллов риска -> уровень серьёзности инцидента
# ----------------------------------------------------------------------------
severity_thresholds:
  low: 0
  medium: 30
  high: 50
  critical: 75
